name: Build with SChannel
on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: cmake
      run: cmake -B build -G "NMake Makefiles" -DUSE_SCHANNEL=1 -DWARNINGS_AS_ERRORS=1

    - name: nmake
      run: |
        cd build
        set CL=/MP
        nmake

    - name: test
      run: |
        cd build
        ./tests
